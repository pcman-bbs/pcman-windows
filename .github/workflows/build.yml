name: Build PCMan

on:
  push:
    branches: [ master ]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ master ]

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: windows-2019
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.1
      with:
        vs-version: '16.0'
        
    - name: Setup vcpkg
      run: |
        git clone https://github.com/Microsoft/vcpkg.git C:\vcpkg
        C:\vcpkg\bootstrap-vcpkg.bat
        C:\vcpkg\vcpkg integrate install
        
    - name: Install dependencies
      run: |
        C:\vcpkg\vcpkg install cpprestsdk[default-features,websockets]:x86-windows
        
    - name: Download VC Redistributable
      run: |
        Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/?LinkId=746571' -Out 'vc_redist.x86.exe'
        
    - name: Run pre-build script
      run: |
        powershell -ExecutionPolicy Bypass -File .\Scripts\BeforeBuild.ps1
        
    - name: Build solution
      run: |
        msbuild PCMan.sln /p:Configuration=Release /p:Platform=Win32 /m /v:minimal
        
    - name: Download non-free resources
      run: |
        powershell -ExecutionPolicy Bypass -File .\Scripts\DownloadNonFree.ps1
        
    - name: Package artifacts
      run: |
        powershell -ExecutionPolicy Bypass -File .\Scripts\AfterBuild.ps1
        
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: PCMan-Build-${{ github.sha }}
        path: |
          Lite/Release/PCMan.zip
          Release/PCMan.exe
        retention-days: 30
        
  release:
    needs: build
    runs-on: windows-2019
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.1
      with:
        vs-version: '16.0'
        
    - name: Setup vcpkg
      run: |
        git clone https://github.com/Microsoft/vcpkg.git C:\vcpkg
        C:\vcpkg\bootstrap-vcpkg.bat
        C:\vcpkg\vcpkg integrate install
        
    - name: Install dependencies
      run: |
        C:\vcpkg\vcpkg install cpprestsdk[default-features,websockets]:x86-windows
        
    - name: Download VC Redistributable
      run: |
        Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/?LinkId=746571' -Out 'vc_redist.x86.exe'
        
    - name: Run pre-build script
      run: |
        powershell -ExecutionPolicy Bypass -File .\Scripts\BeforeBuild.ps1
        
    - name: Build solution
      run: |
        msbuild PCMan.sln /p:Configuration=Release /p:Platform=Win32 /m /v:minimal
        
    - name: Download non-free resources
      run: |
        powershell -ExecutionPolicy Bypass -File .\Scripts\DownloadNonFree.ps1
        
    - name: Package artifacts
      run: |
        powershell -ExecutionPolicy Bypass -File .\Scripts\AfterBuild.ps1
        
    - name: Get version from tag
      id: get_version
      run: |
        $version = "${{ github.ref }}" -replace 'refs/tags/', ''
        echo "version=$version" >> $env:GITHUB_OUTPUT
      shell: pwsh
      
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        name: PCMan ${{ steps.get_version.outputs.version }}
        draft: true
        prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'alpha') }}
        files: |
          Lite/Release/PCMan.zip
          Release/PCMan.exe
        body: |
          ## PCMan ${{ steps.get_version.outputs.version }}
          
          ### 下載
          - **PCMan.exe** - Windows 安裝程式
          - **PCMan.zip** - 免安裝版（綠色版）
          
          ### 系統需求
          - Windows 7 或更新版本
          - Visual C++ 2015-2019 Redistributable (x86)
          
          ### 變更記錄
          請參考 [Changelog](https://github.com/${{ github.repository }}/blob/master/Lite/Release/PCMan/changelog.txt)
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
